apiVersion: v1
kind: ConfigMap
metadata:
  namespace: {{.Values.namespace}}
  name: ha-filesync-list-{{.Values.namespace}}
  labels:
    type: ha_filesync_list
data:
  ha_filesync_list_{{.Values.namespace}}: |
    - label: {{.Values.namespace}}
      path: {{.Values.haRoot}}
      rescanIntervalS: 3600