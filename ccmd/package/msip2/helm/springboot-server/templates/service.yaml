---
apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Values.namespace }}
  name: {{ .Values.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
spec:
  {{- $hasNodePort := false }}
  {{- range .Values.ports }}
  {{- if .nodePort }}
  {{- $hasNodePort = true }}
  {{- end }}
  {{- end }}
  {{- if $hasNodePort }}
  type: NodePort
  {{- end }}
  selector:
    app: {{ .Values.name }}
  ports:
    - port: 9090
      name: healthz
      protocol: TCP
      targetPort: 9090
{{- range .Values.ports }}
    - port: {{ .port }}
      name: {{ .name }}
      protocol: TCP
      targetPort: {{ .port }}
{{- if .nodePort }}
      nodePort: {{ .nodePort }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: actuator-prometheus-{{ .Values.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    platform.prometheus: "/actuator/prometheus"
spec:
  type: ClusterIP
  ports:
    - port: 9090
      targetPort: 9090
      name: metrics
  selector:
    app: {{ .Values.name }}