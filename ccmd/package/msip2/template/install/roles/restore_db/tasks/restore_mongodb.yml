---
# 获取所需参数
- name: make sure app-info files exist
  stat:
    path: "{{ app_info_path }}"
  register: file_status
  delegate_to: "{{ first_kube_master }}"
  run_once: yes

- name: Fail if the file does not exist
  fail:
    msg: "The app-info file does not exist. Aborting!"
  when: not file_status.stat.exists
  run_once: yes

- name: Load variables from app-info
  include_vars:
    file: "{{ app_info_path }}"
    name: data
  delegate_to: "{{ first_kube_master }}"
  run_once: yes

- name: get namespace
  set_fact:
    namespace: "{{ data['app-info'][0]['namespace'] }}"
  delegate_to: "{{ first_kube_master }}"
  run_once: yes

- name: Set mongodb restore path for rollback
  set_fact:
    mongodb_restore_path: "{{ upgrade_backup_dir }}/{{ namespace }}/mongodb"
  delegate_to: "{{ first_kube_master }}"
  run_once: yes
  when: phase == "rollback"

- name: Set mongodb restore path for patch_rollback
  set_fact:
    mongodb_restore_path: "{{ upgrade_backup_dir }}/patch/{{ namespace }}/mongodb"
  delegate_to: "{{ first_kube_master }}"
  run_once: yes
  when: phase == "patch_rollback"

#  检测当前是否已备份
- name: detect if mongo has been backed up (any *.tar.gz)
  shell: |
    BACKUP_DIR="{{ mongodb_restore_path }}/"
    find "$BACKUP_DIR" -maxdepth 1 -type f -name '*.tar.gz' 2>/dev/null | wc -l
  register: mongo_backup_check
  delegate_to: "{{ first_kube_master }}"
  run_once: yes

- name: set mongo_backed fact
  set_fact:
    mongo_backed: "{{ true if mongo_backup_check.stdout|int > 0 else false }}"
  delegate_to: "{{ first_kube_master }}"
  run_once: yes

- name: Print the restore command that is about to be executed
  ansible.builtin.debug:
    msg: |
      ansible-playbook -i {{ inventory_file }} \
      -e 'phase=restore' \
      -e 'role_name=mongodb' \
      -e 'upgrade_mongodb_storage_backup_path={{ mongodb_restore_path }}/' \
      -e 'install_model={{ install_model }} ' \
      -e 'business_path={{ path }}' \
      -e 'path=apaas' \
      -e 'op=manual' \
      -e 'operate_host=kube_control_plane' \
      -e 'dbs=configlistbackup' \
      -e 'group_name=mongodb' \
      -e 'stime=0' \
      -e 'label_name=mongodb' \
      -e 'status=disable' \
      -e '@/data/install/apaas/install/apaas_config.yml' \
      /data/install/apaas/install/apaas_install.yml
  delegate_to: "{{ first_kube_master }}"
  run_once: true
  when: mongo_backed

- name: restore mongodb | Start mongodb_restore playbook...
  shell: |
    ansible-playbook -i {{ inventory_file }} \
    -e 'phase=restore' \
    -e 'role_name=mongodb' \
    -e 'upgrade_mongodb_storage_backup_path={{ mongodb_restore_path }}/' \
    -e 'install_model={{ install_model }} ' \
    -e 'business_path={{ path }}' \
    -e 'path=apaas' \
    -e 'op=manual' \
    -e 'operate_host=kube_control_plane' \
    -e 'dbs=configlistbackup' \
    -e 'group_name=mongodb' \
    -e 'stime=0' \
    -e 'label_name=mongodb' \
    -e 'status=disable' \
    -e '@/data/install/apaas/install/apaas_config.yml' \
    /data/install/apaas/install/apaas_install.yml
  delegate_to: "{{ first_kube_master }}"
  run_once: true
  register: restore_result
  changed_when: restore_result.rc == 0   # ← 只有成功才标记 changed
  failed_when: restore_result.rc != 0
  when: mongo_backed

- name: print playbook exe result
  debug:
    msg: |
      backup playbook recode: {{ restore_result.rc }}
      standout: {{ restore_result.stdout }}
      standerror: {{ restore_result.stderr }}
  when:
    - mongo_backed
    - restore_result.rc != 0

- name: Fail if restore mongodb failed
  fail:
    msg: "Restore mongodb failed with return code {{ restore_result.rc }}"
  when:
    - mongo_backed
    - restore_result is defined
    - restore_result.rc != 0

#  备份临时文件删除
- name:  delete backup mongodbfile
  shell: rm -rf {{ mongodb_restore_path }}/*
  delegate_to: "{{ first_kube_master }}"
  run_once: yes
  ignore_errors: true
  when:
    - mongo_backed
    - restore_result.rc == 0
