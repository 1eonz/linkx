haControl: "true"
enableRestart: "true"
ports:
  - name: http
    port: 8080
  - name: dubbo
    port: 18080
container:
  strategy: Recreate
  replicas: 1
  vault: true
  volumes:
  envs:
    env:
      - name: MYSQL_ROOT_PASSWORD
        value: safebox:platform/platform-secret#mysql_password
      - name: REDIS_PASSWORD
        value: safebox:platform/platform-secret#redis_password
    env_from:
      - configMapRef:
          name: cloudcmd-profile
  jvm:
    xmx: 1g
    xms: 1g
