haControl: "true"
ports:
  - name: web
    port: 8012
container:
  strategy:
  replicas: 1
  vault: false
  volumes:
  config_map:
    - name: config
      mount_path: /etc/nginx/conf.d/
      data:
        cloud.admin.conf: |-
          server{
              listen       8012;
          
              location /{
                  if ($request_method = 'OPTIONS') {
                      return 200;
                  }
                  alias /usr/share/nginx/html/;
                  index index.html index.htm login.html;
                  try_files $uri $uri/ /index.html;
                  proxy_set_header x-forwarded-for $remote_addr;
              }
          }