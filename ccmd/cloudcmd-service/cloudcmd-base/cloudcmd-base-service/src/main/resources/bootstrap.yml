spring:
  application:
    name: cloudcmd-base-service
  messages:
    basename: base_servcie,license,common_bean

  datasource:
    dynamic:
      primary: master
      strict: true
      datasource:
        master:
          driver-class-name: com.mysql.jdbc.Driver
          url: jdbc:mysql://${cloudcmd.mysql.host}/icp_res?allowPublicKeyRetrieval=true&useSSL=false&allowMultiQueries=true&useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&useSSL=false&zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&
          username: ${cloudcmd.mysql.username}
          password: ${cloudcmd.mysql.password}
          type: com.zaxxer.hikari.HikariDataSource
          hikari:
            pool-name: mysql-res
            connection-test-query: SELECT 1
            autoCommit: true
            minimum-idle: 3
            maximum-pool-size: 30
        linkx_base:
          driver-class-name: com.mysql.jdbc.Driver
          url: jdbc:mysql://${cloudcmd.mysql.host}/linkx_base?allowPublicKeyRetrieval=true&useSSL=false&allowMultiQueries=true&useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&useSSL=false&zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&
          username: ${cloudcmd.mysql.username}
          password: ${cloudcmd.mysql.password}
          type: com.zaxxer.hikari.HikariDataSource
          hikari:
            pool-name: mysql-linkx-base
            connection-test-query: SELECT 1
            autoCommit: true
            connectionTimeout: 30000
            idleTimeout: 600000
            maxLifetime: 1800000
            minimum-idle: 5
            maximum-pool-size: 50

mybatis-plus:
  type-handlers-package: com.tdtech.cloudcmd
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
    map-underscore-to-camel-case: true

dubbo:
  metrics:
    protocol: prometheus
    enable: true

management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
    enable:
      jvm: true
      process: true
      system: true
    export:
      prometheus:
        enabled: true
        step: 30s
        descriptions: true
  prometheus:
    metrics:
      export:
        enabled: true
  endpoint:
    prometheus:
      enabled: true
    health:
      probes:
        enabled: true
      show-details: always
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState