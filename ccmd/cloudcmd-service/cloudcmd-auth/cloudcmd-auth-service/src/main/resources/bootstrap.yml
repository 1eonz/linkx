spring:
  application:
    name: cloudcmd-auth-service

  messages:
    basename: auth_service,license,common_bean

  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://${cloudcmd.mysql.host}/icp_res?allowPublicKeyRetrieval=true&useSSL=false&useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&useSSL=false&zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai
    username: ${cloudcmd.mysql.username}
    password: ${cloudcmd.mysql.password}
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      pool-name: mysql-collabs
      connection-test-query: SELECT 1
      auto-commit: true                           # 核心修复：驼峰命名（3.1.1不支持auto-commit）
      connectionTimeout: 30000                   # 驼峰命名（连接超时30秒，3.1.1版本支持）
      idleTimeout: 600000                        # 驼峰命名（空闲超时10分钟，超时释放连接）
      maxLifetime: 1800000
      minimum-idle: 30
      maximum-pool-size: 100
  # ES相关配置
  elasticsearch:
    uris: http://${cloudcmd.es.host}

cloudcmd:
  expires_in: 3600
  cron:
    refresh-cache: 0 0 2 * * ?
  im:
    jinxing:
      coop:
        httpclient:
          enabled: true

mybatis-plus:
  type-handlers-package: com.tdtech.cloudcmd
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
    map-underscore-to-camel-case: true

dubbo:
  metrics:
    protocol: prometheus
    enable: true

management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
    enable:
      jvm: true
      process: true
      system: true
    export:
      prometheus:
        enabled: true
        step: 30s
        descriptions: true
  prometheus:
    metrics:
      export:
        enabled: true
  endpoint:
    prometheus:
      enabled: true
    health:
      probes:
        enabled: true
      show-details: always
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
