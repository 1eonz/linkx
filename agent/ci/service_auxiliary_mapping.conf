# 服务与辅助产物映射配置
# 格式：服务名:辅助产物1,辅助产物2,...|数据库1,数据库2,...
#
# 辅助产物类型：
#   db_backup_config    - 数据库备份配置 (backupdb_config.yml)
#   file_backup_config  - 文件备份配置 (backup_files_host.conf)
#   upgrade_scripts     - 升级前后脚本 (upgrade_pre/post_handle.sh, degrade_pre/post_handle.sh)
#   flyway_job          - Flyway 数据库迁移 Job (dbjob.yaml)
#   stop_start_scripts  - 停启服务脚本 (stop_svc.sh, start_svc.sh)
#
# 数据库映射：
#   | 后面逗号分隔的数据库名，表示该服务涉及的数据库
#   补丁打包时，只备份和执行这些数据库的 flyway 脚本

# 网关服务变更 -> 纯路由转发，不直接连接数据库，只需文件备份、升级脚本、停启脚本
crs-gateway:file_backup_config,upgrade_scripts,stop_start_scripts

# Java 后端服务变更 -> 直接连接数据库，需要数据库备份、文件备份、升级脚本、停启脚本、flyway迁移
crs-module-infra:db_backup_config,file_backup_config,upgrade_scripts,stop_start_scripts,flyway_job|agent
crs-module-system:db_backup_config,file_backup_config,upgrade_scripts,stop_start_scripts,flyway_job|agent
crs-module-ai-agent:db_backup_config,file_backup_config,upgrade_scripts,stop_start_scripts,flyway_job|agent

# 数据库迁移服务 -> 自身就包含数据库备份配置（全量数据库），独立出补丁时需要 flyway_job 触发 dbjob.yaml
db-migrate:db_backup_config,flyway_job|agent

# 前端服务变更 -> 需要文件备份、升级脚本、停启脚本（不涉及数据库）
web:file_backup_config,upgrade_scripts,stop_start_scripts

# mock-ai 不涉及数据库
mock-ai:upgrade_scripts