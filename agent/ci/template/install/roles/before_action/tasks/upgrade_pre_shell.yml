- name: Check if upgrade script exists
  ansible.builtin.stat:
    path: "{{ app_root }}/backup_config/upgrade_pre_handle.sh"
  register: upgrade_pre_script_stat
  run_once: true
  delegate_to: "{{ first_kube_master }}"

- name: Set fact - script exists flag
  ansible.builtin.set_fact:
    upgr_script_exists: "{{ upgrade_pre_script_stat.stat.exists }}"
    cacheable: true
  run_once: true
  delegate_to: "{{ first_kube_master }}"

- name: Ensure upgrade script has execute permission
  ansible.builtin.file:
    path: "{{ app_root }}/backup_config/upgrade_pre_handle.sh"
    mode: '0755'
    state: file
  run_once: true
  delegate_to: "{{ first_kube_master }}"
  when: upgr_script_exists | bool

- name: Execute upgrade pre handle script | {{ upgr_script_exists }}
  shell: "{{ app_root }}/backup_config/upgrade_pre_handle.sh"
  run_once: true
  delegate_to: "{{ first_kube_master }}"
  when: upgr_script_exists | bool
