# 升级/回退备份目录
upgrade_backup_dir: /data/msip/backup
# ansible inventory 文件路径
inventory_file: "/data/hosts/{{ install_model }}.ini"

app_info_path: "{{ app_root }}/app-info.yaml"
backup_config_path: "{{ app_root }}/backup_config/backupdb_config.yml"
greatsql_repo: "{{ image_repo_url }}"

great_storage_restore_path: /data/msip/data/greatsql
great_storage_data_path: /data/msip/data/greatsql
mysql_storage_data_path: /data/msip/data/mysql
great_storage_backup_path: /data/msip/backup/
greatsql_manifest_folder: "{{ kube_config_dir }}/addons/greatsql"
great_storage_backup_tmp1_path: /data/msip/backup/tmp1/
greatsql_backup_version: 8.0.35-31
mysql_ip_list: "{{ groups['mysql'] | map('extract', hostvars, 'inventory_hostname') | list }}"