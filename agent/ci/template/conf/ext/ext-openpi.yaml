apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: route-30113-hr-0
  namespace: agent
spec:
  parentRefs:
    - name: agent-gateway
      namespace: agent
      sectionName: agent-30112
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: agent-gateway
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /admin-api/proxy/ai/v1/aiagent
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: agent-ai-agent
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /admin-api/proxy/ai/v1/infra
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: agent-infra
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /admin-api/proxy/ai/v1/system
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: agent-system
          port: 8080
