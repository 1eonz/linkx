apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-route-conf
  namespace: agent
data:
  "route-conf.yaml": |-
    spring:
      cloud:
        # Spring Cloud Gateway 配置项，对应 GatewayProperties 类
        gateway:
          # 路由配置项，对应 RouteDefinition 数组
          routes:
            ## system-server 服务
            - id: system-admin-api # 路由的编号
              uri: grayLb://system-server
              predicates: # 断言，作为路由的匹配条件，对应 RouteDefinition 数组
                - Path=/admin-api/proxy/ai/v1/system/**
            - id: system-app-api # 路由的编号
              uri: grayLb://system-server
              predicates: # 断言，作为路由的匹配条件，对应 RouteDefinition 数组
                - Path=/app-api/proxy/ai/v1/system/**
            ## infra-server 服务
            - id: infra-admin-api # 路由的编号
              uri: grayLb://infra-server
              predicates: # 断言，作为路由的匹配条件，对应 RouteDefinition 数组
                - Path=/admin-api/proxy/ai/v1/infra/**
            - id: infra-app-api # 路由的编号
              uri: grayLb://infra-server
              predicates: # 断言，作为路由的匹配条件，对应 RouteDefinition 数组
                - Path=/app-api/proxy/ai/v1/infra/**
            - id: infra-spring-boot-admin # 路由的编号（Spring Boot Admin）
              uri: grayLb://infra-server
              predicates: # 断言，作为路由的匹配条件，对应 RouteDefinition 数组
                - Path=/admin/**
            - id: infra-websocket # 路由的编号（WebSocket）
              uri: lb:ws://infra-server
              predicates: # 断言，作为路由的匹配条件，对应 RouteDefinition 数组
                - Path=/infra/ws,/infra/ws/**
            ## ai 服务
            - id: ai-admin-api # 路由的编号
              uri: grayLb://ai-agent-server
              predicates: # 断言，作为路由的匹配条件，对应 RouteDefinition 数组
                - Path=/admin-api/proxy/ai/v1/aiagent/**
            - id: ai-app-api # 路由的编号
              uri: grayLb://ai-agent-server
              predicates: # 断言，作为路由的匹配条件，对应 RouteDefinition 数组
                - Path=/proxy/ai/v1/deepseek-zjk/**
              filters:
                - RewritePath=/proxy/ai/v1/deepseek-zjk/?(?<segment>.*), /app-api/proxy/ai/v1/deepseek-zjk/$\{segment} # 配置，保证转发到 /v3/api-docs
            - id: ai-app-api-1 # 路由的编号
              uri: grayLb://ai-agent-server
              predicates: # 断言，作为路由的匹配条件，对应 RouteDefinition 数组
                - Path=/deepseek-zjk/**
              filters:
                - RewritePath=/deepseek-zjk/?(?<segment>.*), /app-api/deepseek-zjk/$\{segment} # 配置，保证转发到 /v3/api-docs
          x-forwarded:
            prefix-enabled: false # 避免 Swagger 重复带上额外的 /admin-api/proxy/ai/v1/system 前缀
            

---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: agent
  name: agent-gateway
  labels:
    app: agent-gateway
    app.kubernetes.io/name: agent-gateway
    ha-service-stop/enable: "true"
spec:
  replicas: 1
  template:
    metadata:
      name: agent-gateway
      labels:
        app: agent-gateway
        app.kubernetes.io/name: agent-gateway
        enableRestart: "true"
      annotations:
        safebox/enable: "true"
    spec:
      volumes:
        - name: agent-profile
          configMap:
            name: agent-profile
            items:
              - key: application.yml
                path: application.yml
        - name: gateway-route-conf
          configMap:
            name: gateway-route-conf
            items:
              - key: route-conf.yaml
                path: route-conf.yaml
      containers:
        - name: agent-gateway
          image: imagerepo.td-tech.com:5001/agent-gateway:{{ .Values.version }}.{{ .Values.arch }}
          command: [ 'java' ]
          args:
            - -jar
            - -Dfile.encoding=UTF-8
            - -Xmx2048m
            - -Xms256m
            - -XX:+UseZGC
            - -XX:+ZGenerational
            - -XX:ZUncommitDelay=300
            - -XX:+UseLargePages
            - -XX:+UseTransparentHugePages
            - -Dserver.port=8080
            - -Dspring.profiles.active=prod
            - /app/app.jar
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9090
          volumeMounts:
            - name: agent-profile
              mountPath: /app/config/
            - name: gateway-route-conf
              mountPath: /app/route/
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 9090
            failureThreshold: 12
            initialDelaySeconds: 10
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 9090
            failureThreshold: 6
            initialDelaySeconds: 10
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          env:
            - name: NACOS_ADDRESS
              value: nacos.platform:8848
            - name: NACOS_GROUP
              value: agent
            - name: MYSQL_HOST
              value: cnp-leader.platform.svc
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_USER
              value: cnp
            - name: MYSQL_PASSWORD
              value: safebox:platform/platform-secret#mysql_password
            - name: REDIS_HOST
              value: redis.platform.svc
            - name: REDIS_POST
              value: "6379"
            - name: REDIS_PASSWORD
              value: safebox:platform/platform-secret#redis_password
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka-service.platform.svc.cluster.local:9092
            - name: cloudcmd.service.name
              value: agent-gateway
            - name: SERVER_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: pod.ip
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: status.podIP
            - name: pod.name
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.name
      restartPolicy: Always
  selector:
    matchLabels:
      app: agent-gateway
---
apiVersion: v1
kind: Service
metadata:
  namespace: agent
  name: agent-gateway
spec:
  selector:
    app: agent-gateway
  ports:
    - port: 8080
      name: http
      protocol: TCP
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  namespace: agent
  name: actuator-prometheus-agent-gateway
  annotations:
    platform.prometheus: "/actuator/prometheus"
spec:
  type: ClusterIP
  ports:
    - port: 9090
      targetPort: 9090
      name: metrics
  selector:
    app: agent-gateway
